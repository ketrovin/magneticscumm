<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Hill Mystery</title>
  <meta name="description"
    content="A SCUMM-style point-and-click adventure game in the spirit of Zak McKraken and the Alien Mindbenders." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="game-wrapper">
    <div id="title-bar">
      <span id="game-title">⊕ MAGNETIC HILL MYSTERY</span>
      <span id="score-display">Score: <strong id="score">0</strong></span>
    </div>

    <!-- The canvas fills the panel area. 960×600 internal resolution. -->
    <canvas id="game" width="960" height="600" tabindex="0"></canvas>

    <div id="loading-overlay">
      <div id="loading-text">LOADING…</div>
      <div id="click-prompt" style="display: none;">CLICK ANYWHERE TO START</div>
    </div>
  </div>

  <script src="engine/InputManager.js"></script>
  <script src="engine/ScummUI.js"></script>
  <script src="engine/SpriteAnimator.js"></script>
  <script src="engine/Actor.js"></script>
  <script src="engine/Room.js"></script>
  <script src="engine/Engine.js"></script>
  <script src="game/main.js"></script>
  <script>
    // Managed Triple-Phase Splash Screen
    window.addEventListener('load', () => {
      const overlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');
      const clickPrompt = document.getElementById('click-prompt');
      
      // Phase logic: loading -> ready (sound) -> playing (waiting for start)
      let phase = 'loading'; 

      const checkReady = () => {
        // Initial readiness: Title screen is enough to show "Click for Sound"
        if (phase === 'loading' && window._engine && window._engine.rooms && window._engine.rooms['title_screen']) {
          phase = 'ready';
          loadingText.style.display = 'none';
          clickPrompt.style.display = 'block';
          clickPrompt.innerText = 'CLICK FOR SOUND';
        }
        
        // Secondary readiness: If we are in 'playing' phase, check if game is ready to start
        if (phase === 'playing') {
          const isGameReady = window._engine.rooms['bedroom'] && window._engine.player;
          if (isGameReady) {
            clickPrompt.innerText = 'CLICK TO START';
            clickPrompt.classList.add('pulse');
          } else {
            const status = window._engine.assetStatus;
            if (status && status.total > 0) {
              const pct = Math.floor((status.loaded / status.total) * 100);
              clickPrompt.innerText = `LOADING ASSETS (${pct}%)...`;
            } else {
              clickPrompt.innerText = 'LOADING ASSETS...';
            }
            clickPrompt.classList.remove('pulse');
          }
        }
        
        setTimeout(checkReady, 100);
      };
      checkReady();

      overlay.addEventListener('click', (e) => {
        if (!window._engine) return;

        if (phase === 'ready') {
          // Phase 1: Unblock sound and move to waiting for start
          window._engine.playMusic('opener');
          phase = 'playing';
          
          // Feedback will be handled by checkReady() loop
        } else if (phase === 'playing') {
          // Phase 2: Trigger the engine's start logic and hide the overlay
          if (!window._engine.rooms['bedroom'] || !window._engine.player) {
            console.log("Game not ready yet...");
            return; 
          }

          // Trigger the 'start_button' interact in title screen
          const titleRoom = window._engine.rooms['title_screen'];
          if (titleRoom && titleRoom.hotspots) {
            const btn = titleRoom.hotspots.find(h => h.id === 'start_button');
            if (btn && btn.onInteract) {
              btn.onInteract('Use', window._engine);
            }
          }

          overlay.classList.add('hidden');
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 800);
        }
      });
    });
  </script>
</body>

</html>
