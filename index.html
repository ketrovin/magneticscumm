<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Hill Mystery</title>
  <meta name="description"
    content="A SCUMM-style point-and-click adventure game in the spirit of Zak McKraken and the Alien Mindbenders." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="game-wrapper">
    <div id="title-bar">
      <span id="game-title">⊕ MAGNETIC HILL MYSTERY</span>
      <span id="score-display">Score: <strong id="score">0</strong></span>
    </div>

    <!-- The canvas fills the panel area. 960×600 internal resolution. -->
    <canvas id="game" width="960" height="600" tabindex="0"></canvas>

    <div id="loading-overlay">
      <div id="loading-text">LOADING…</div>
      <div id="start-prompt" style="display: none; color: #c8a84b; font-size: 32px; cursor: pointer; text-shadow: 2px 2px 4px #000;">CLICK TO BEGIN</div>
    </div>
  </div>

  <script src="engine/InputManager.js"></script>
  <script src="engine/ScummUI.js"></script>
  <script src="engine/SpriteAnimator.js"></script>
  <script src="engine/Actor.js"></script>
  <script src="engine/Room.js"></script>
  <script src="engine/Engine.js"></script>
  <script src="game/main.js"></script>
  <script>
    // Managed Splash Screen / Loading Sequence
    window.addEventListener('load', () => {
      const overlay = document.getElementById('loading-overlay');
      const startPrompt = document.getElementById('start-prompt');
      const loadingText = document.getElementById('loading-text');

      // 1. Wait for engine and assets to be ready
      const checkReady = () => {
        if (window._engine && window._engine.rooms && window._engine.rooms['title_screen']) {
          loadingText.style.display = 'none';
          startPrompt.style.display = 'block';
        } else {
          setTimeout(checkReady, 100);
        }
      };
      checkReady();

      // 2. State management
      let hasMusicStarted = false;

      // 3. Handle interactions
      overlay.addEventListener('click', () => {
        if (!window._engine) return;

        if (!hasMusicStarted) {
          // First click: Start music and turn prompt into "Start Game" if ready
          window._engine.playMusic('opener');
          hasMusicStarted = true;
          if (startPrompt.style.display === 'block') {
             startPrompt.innerText = 'PRESS START';
          }
        } else if (startPrompt.style.display === 'block') {
          // Second click: Stop music and enter Dave's bedroom
          window._engine.stopMusic();
          window._engine.changeRoom('bedroom', 480, 450);
          
          overlay.style.transition = 'opacity 0.8s ease-out';
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 800);
        }
      });
    });
  </script>
</body>

</html>
