<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Hill Mystery</title>
  <meta name="description"
    content="A SCUMM-style point-and-click adventure game in the spirit of Zak McKraken and the Alien Mindbenders." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="game-wrapper">
    <div id="title-bar">
      <span id="game-title">⊕ MAGNETIC HILL MYSTERY</span>
      <span id="score-display">Score: <strong id="score">0</strong></span>
    </div>

    <!-- The canvas fills the panel area. 960×600 internal resolution. -->
    <canvas id="game" width="960" height="600" tabindex="0"></canvas>

    <div id="loading-overlay">
      <div id="loading-text">LOADING…</div>
      <!-- Phase 1: Sound Initiation -->
      <button id="btn-sound" style="display: none;">CLICK FOR SOUND</button>
      <!-- Phase 2: Game Initiation -->
      <button id="btn-start" style="display: none;">PRESS START</button>
    </div>
  </div>

  <script src="engine/InputManager.js"></script>
  <script src="engine/ScummUI.js"></script>
  <script src="engine/SpriteAnimator.js"></script>
  <script src="engine/Actor.js"></script>
  <script src="engine/Room.js"></script>
  <script src="engine/Engine.js"></script>
  <script src="game/main.js"></script>
  <script>
    // Managed Triple-Phase Splash Screen
    window.addEventListener('load', () => {
      const overlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');
      const btnSound = document.getElementById('btn-sound');
      const btnStart = document.getElementById('btn-start');

      // 1. Wait for engine/assets
      const checkReady = () => {
        if (window._engine && window._engine.rooms && window._engine.rooms['title_screen']) {
          loadingText.style.display = 'none';
          btnSound.style.display = 'block';
        } else {
          setTimeout(checkReady, 100);
        }
      };
      checkReady();

      // 2. Phase 1: Enable Audio
      btnSound.addEventListener('click', (e) => {
        e.stopPropagation();
        if (window._engine) {
          window._engine.playMusic('opener');
          btnSound.style.display = 'none';
          btnStart.style.display = 'block';
        }
      });

      // 3. Phase 2: Enter Game
      btnStart.addEventListener('click', (e) => {
        e.stopPropagation();
        if (window._engine) {
          window._engine.stopMusic();
          // Start the normal playlist
          window._engine.gameState.music.backgroundTrack = 'track1';
          window._engine.changeRoom('bedroom', 480, 450);
          
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 800);
        }
      });
    });
  </script>
</body>

</html>
